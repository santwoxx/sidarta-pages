<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sature AI Builder</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; height: 100vh; background: #f8f9fa; color: #212529; }
    .sidebar { width: 300px; background: #ffffff; border-right: 1px solid #e9ecef; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #e9ecef; }
    .sidebar-header h2 { margin: 0; font-size: 18px; color: #0d6efd; }
    .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .input-area { padding: 20px; border-top: 1px solid #e9ecef; display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 10px 15px; border: 1px solid #dee2e6; border-radius: 8px; outline: none; }
    .input-area button { background: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .preview-container { flex: 1; background: #e9ecef; padding: 20px; display: flex; flex-direction: column; }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .preview-header h3 { margin: 0; }
    .preview-frame { flex: 1; background: white; border-radius: 12px; border: 1px solid #dee2e6; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .preview-frame iframe { width: 100%; height: 100%; border: none; }
    .message { padding: 12px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
    .msg-user { background: #0d6efd; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg-ai { background: #f1f3f5; color: #212529; align-self: flex-start; border-bottom-left-radius: 2px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Sature AI Builder</h2>
    </div>
    <div class="chat-container" id="chat">
      <div class="message msg-ai">Olá! Eu sou o novo construtor independente da Sature. O que vamos criar hoje?</div>
    </div>
    <div class="input-area">
      <input type="text" id="prompt-input" placeholder="Descreva seu site...">
      <button id="btn-send">Enviar</button>
    </div>
  </div>
  <div class="preview-container">
    <div class="preview-header">
      <h3>Preview ao vivo</h3>
      <button style="background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Publicar</button>
    </div>
    <div class="preview-frame" id="preview-frame">
      <p style="color: #6c757d; font-size: 14px;">O código gerado aparecerá aqui.</p>
    </div>
  </div>

  <script src="../services/ai-service.js"></script>
  <script src="workspace.js"></script>
</body>
</html>
